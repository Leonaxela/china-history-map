allow = ["Bash=Get-ChildItem -Force | Select-Object Mode, Length, Name; Write-Output \"---\"; if (Test-Path .git) { git log --oneline -5 2>$null }", "Bash=$ErrorActionPreference='SilentlyContinue'\n$queries = @('明朝 地图 geojson','china historical map geojson','chinese history map geojson','ming dynasty map')\nforeach ($q in $queries) {\n  $enc = [uri]::EscapeDataString($q)\n  $r = Invoke-RestMethod -Uri \"https://api.github.com/search/repositories?q=$enc&per_page=5\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 20\n  Write-Output \"=== $q ===\"\n  foreach ($item in $r.items) { Write-Output (\"{0} | {1} | {2}\" -f $item.full_name, $item.stargazers_count, $item.description) }\n}", "Bash=$ErrorActionPreference='SilentlyContinue'\n$queries = @('china ancient map','china historical geography','chgis','谭其骧','history map china data','ancient china provinces geojson')\nforeach ($q in $queries) {\n  $enc = [uri]::EscapeDataString($q)\n  $r = Invoke-RestMethod -Uri \"https://api.github.com/search/repositories?q=$enc&per_page=8\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 20\n  Write-Output \"=== $q ===\"\n  foreach ($item in $r.items) { Write-Output (\"{0} | {1}★ | {2}\" -f $item.full_name, $item.stargazers_count, $item.description) }\n  Start-Sleep -Milliseconds 400\n}", "Bash=$ErrorActionPreference='SilentlyContinue'\nfunction Show-Repo($repo) {\n  Write-Output \"=== $repo ===\"\n  $r = Invoke-RestMethod -Uri \"https://api.github.com/repos/$repo\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 20\n  Write-Output (\"desc: {0} | license: {1} | size: {2}KB | updated: {3}\" -f $r.description, $r.license.spdx_id, $r.size, $r.updated_at)\n  $t = Invoke-RestMethod -Uri \"https://api.github.com/repos/$repo/git/trees/HEAD?recursive=1\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 30\n  $t.tree | Where-Object { $_.type -eq 'blob' } | Select-Object -First 30 | ForEach-Object { Write-Output (\"  \" + $_.path) }\n}\nShow-Repo \"stardustman/ancient-china-map\"\nShow-Repo \"13098806890/shiyu\"\nShow-Repo \"amael-ls/chinese_maps\"", "Bash=$ErrorActionPreference='SilentlyContinue'\n$urls = @(\n  'https://chgis.fas.harvard.edu/',\n  'https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/',\n  'https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/v6/'\n)\nforeach ($u in $urls) {\n  Write-Output \"=== $u ===\"\n  try {\n    $resp = Invoke-WebRequest -Uri $u -TimeoutSec 25 -Headers @{ 'User-Agent'='Mozilla/5.0' }\n    Write-Output (\"status: \" + $resp.StatusCode + \" len: \" + $resp.Content.Length)\n    $links = [regex]::Matches($resp.Content, 'href=\"([^\"]+)\"') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique -First 40\n    $links | ForEach-Object { Write-Output (\"  \" + $_) }\n  } catch { Write-Output (\"ERR: \" + $_.Exception.Message) }\n}", "Bash=$ErrorActionPreference='SilentlyContinue'\n$u = 'https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/'\n$resp = Invoke-WebRequest -Uri $u -TimeoutSec 25 -Headers @{ 'User-Agent'='Mozilla/5.0' }\nWrite-Output (\"status: \" + $resp.StatusCode + \" len: \" + $resp.Content.Length)\n[regex]::Matches($resp.Content, 'href=\"([^\"]+)\"') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique | Select-Object -First 60 | ForEach-Object { Write-Output (\"  \" + $_) }", "Bash=curl.exe -s -L -m 30 -A \"Mozilla/5.0\" \"https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/\" -o \"$env:TEMP\\chgis_dl.html\"; if ($?) { (Get-Item \"$env:TEMP\\chgis_dl.html\").Length }", "Bash=node -e \"fetch('https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/',{headers:{'User-Agent':'Mozilla/5.0'}}).then(r=>r.text()).then(t=>{console.log('len',t.length);const m=t.match(/href=\\\"([^\\\"]+)\\\"/g)||[];console.log(m.slice(0,60).join('\\n'));}).catch(e=>console.log('ERR',e.message))\"", "Bash=$script = @'\nfetch('https://sites.fas.harvard.edu/~chgis/data/chgis/downloads/',{headers:{'User-Agent':'Mozilla/5.0'}})\n  .then(r=>r.text())\n  .then(t=>{\n    console.log('len',t.length);\n    const m=t.match(/href=\"([^\"]+)\"/g);\n    console.log((m||[]).slice(0,60).join('\\n'));\n  })\n  .catch(e=>console.log('ERR',e.message));\n'@\nSet-Content -Path \"$env:TEMP\\probe.js\" -Value $script -Encoding UTF8\nnode \"$env:TEMP\\probe.js\"", "Bash=$ErrorActionPreference='SilentlyContinue'\n$urls = @('https://api.github.com/zen','https://raw.githubusercontent.com/13098806890/shiyu/main/data/places/dynasty-boundaries/README.md','https://www.ditugui.com/','https://sites.fas.harvard.edu/~chgis/')\nforeach ($u in $urls) {\n  try {\n    $r = Invoke-WebRequest -Uri $u -TimeoutSec 20 -Headers @{ 'User-Agent'='Mozilla/5.0' } -UseBasicParsing\n    Write-Output (\"OK   {0} -> {1}\" -f $u, $r.StatusCode)\n  } catch { Write-Output (\"FAIL {0} -> {1}\" -f $u, $_.Exception.Message) }\n}", "Bash=$ErrorActionPreference='SilentlyContinue'\n$r = Invoke-RestMethod -Uri \"https://api.github.com/repos/13098806890/shiyu/git/trees/HEAD?recursive=1\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 30\n$t = $r.tree | Where-Object { $_.type -eq 'blob' }\nWrite-Output \"=== shiyu 数据相关文件 ===\"\n$t | Where-Object { $_.path -like '*dynasty*' -or $_.path -like 'data/places/*' } | ForEach-Object { Write-Output (\"  {0}  ({1} bytes)\" -f $_.path, $_.size) }\nWrite-Output \"\"\nWrite-Output \"=== 所有 geojson ===\"\n$t | Where-Object { $_.path -like '*.geojson' } | ForEach-Object { Write-Output (\"  {0}  ({1} bytes)\" -f $_.path, $_.size) }", "Bash=$ErrorActionPreference='SilentlyContinue'\n$base = 'https://raw.githubusercontent.com/13098806890/shiyu/main/data/places/dynasty-boundaries/'\n$readme = Invoke-WebRequest -Uri ($base + 'README.md') -TimeoutSec 20 -Headers @{ 'User-Agent'='Mozilla/5.0' } -UseBasicParsing\nWrite-Output $readme.Content\nWrite-Output \"\"\nWrite-Output \"=== territories.json 前 2000 字符 ===\"\n$tj = Invoke-WebRequest -Uri ($base + 'territories.json') -TimeoutSec 20 -Headers @{ 'User-Agent'='Mozilla/5.0' } -UseBasicParsing\n$tj.Content.Substring(0, [Math]::Min(2000, $tj.Content.Length))", "Bash=$ErrorActionPreference='SilentlyContinue'\nNew-Item -ItemType Directory -Force -Path \"data\\raw\" | Out-Null\n$base = 'https://raw.githubusercontent.com/13098806890/shiyu/main/data/places/dynasty-boundaries/'\n$files = @(\n  'chgis-timeseries-prefecture.geojson',\n  'chgis-timeseries-county-points.geojson',\n  'chgis-1820-province.geojson',\n  'chgis-1820-prefecture.geojson',\n  'chgis-1820-prefecture-points.geojson',\n  'chgis-1820-lakes.geojson',\n  'chgis-1820-rivers.geojson',\n  'chgis-1911-prefecture.geojson',\n  'territories.json'\n)\nforeach ($f in $files) {\n  try {\n    Invoke-WebRequest -Uri ($base + $f) -OutFile (\"data\\raw\\\" + $f) -TimeoutSec 120 -Headers @{ 'User-Agent'='Mozilla/5.0' } -UseBasicParsing\n    Write-Output (\"OK   {0}  {1:N0} bytes\" -f $f, (Get-Item (\"data\\raw\\\" + $f)).Length)\n  } catch { Write-Output (\"FAIL {0}  {1}\" -f $f, $_.Exception.Message) }\n}\n# modern china\ntry {\n  Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/13098806890/shiyu/main/data/places/modern-china.geojson' -OutFile 'data\\raw\\modern-china.geojson' -TimeoutSec 120 -Headers @{ 'User-Agent'='Mozilla/5.0' } -UseBasicParsing\n  Write-Output (\"OK   modern-china.geojson  {0:N0} bytes\" -f (Get-Item 'data\\raw\\modern-china.geojson').Length)\n} catch { Write-Output (\"FAIL modern-china.geojson  {0}\" -f $_.Exception.Message) }", "Bash=$ErrorActionPreference='SilentlyContinue'\n$queries = @('china mountains geojson','china mountain ranges data','natural earth mountains china')\nforeach ($q in $queries) {\n  $enc = [uri]::EscapeDataString($q)\n  $r = Invoke-RestMethod -Uri \"https://api.github.com/search/repositories?q=$enc&per_page=6\" -Headers @{ 'User-Agent'='reasonix' } -TimeoutSec 20\n  Write-Output \"=== $q ===\"\n  foreach ($item in $r.items) { Write-Output (\"{0} | {1}★ | {2}\" -f $item.full_name, $item.stargazers_count, $item.description) }\n  Start-Sleep -Milliseconds 400\n}"]
